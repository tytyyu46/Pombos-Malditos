<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pombos Malditos: Campina Sangrenta</title>
    <link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #111; 
            font-family: 'Finger Paint', cursive; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        canvas { 
            border: 10px solid #3d2611; 
            box-shadow: 0 0 100px rgba(0,0,0,0.8); 
            cursor: crosshair;
            border-radius: 4px;
        }
        #ui { position: absolute; top: 30px; width: 100%; text-align: center; color: white; pointer-events: none; z-index: 5; text-shadow: 3px 3px #000; }
        .bar-bg { width: 350px; height: 14px; background: rgba(0,0,0,0.6); border: 2px solid #ffd700; border-radius: 20px; overflow: hidden; margin: 8px auto; }
        .pombo-hp { height: 100%; background: linear-gradient(90deg, #ff0000, #8b0000); transition: width 0.3s; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 10; text-align: center; }
        h1 { font-size: 55px; color: #ffcc00; margin: 0; text-shadow: 5px 5px #000; letter-spacing: 2px; }
        .weapon-select { display: flex; gap: 15px; margin: 25px 0; }
        .btn { background: #ffcc00; border: none; padding: 15px 35px; font-size: 18px; font-family: 'Finger Paint', cursive; cursor: pointer; border-radius: 50px; color: #222; transition: 0.3s; box-shadow: 0 6px #b38f00; }
        .btn:hover { background: #fff; transform: translateY(-3px); }
        .btn.active { background: #00ff00; box-shadow: 0 6px #008800; color: #000; }
        #btn-jogar { padding: 20px 70px; font-size: 28px; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="ui">
        <h1 id="level-display" style="font-size: 22px; color: #ffd700;">FLORESTA CENTRAL - FASE 1</h1>
        <div id="pombo-bars"></div>
        <div id="status" style="font-size: 24px;"></div>
    </div>

    <div id="overlay">
        <h1 id="main-title">POMBOS MALDITOS</h1>
        <p style="font-size: 18px; color: #ccc;">Sobreviva ao enxame na clareira.</p>
        <div class="weapon-select">
            <button class="btn" id="btn-leve" onclick="setWeapon('leve')">LEVE</button>
            <button class="btn active" id="btn-padrao" onclick="setWeapon('padrao')">PADRÃO</button>
            <button class="btn" id="btn-pesada" onclick="setWeapon('pesada')">PESADA</button>
        </div>
        <button id="btn-jogar" class="btn" onclick="startGame()">INICIAR CAÇA</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    canvas.width = 1000; canvas.height = 700;

    // --- CONFIGURAÇÕES VISUAIS ---
    const clouds = Array.from({length: 6}, () => ({ x: Math.random()*1000, y: 50 + Math.random()*120, speed: 0.2 + Math.random()*0.5, size: 40 + Math.random()*40 }));
    const trees = Array.from({length: 12}, () => ({ x: Math.random()*1100 - 50, y: 220 + Math.random()*60, scale: 0.7 + Math.random()*0.6 }));

    function drawBackground() {
        // Céu
        let sky = ctx.createLinearGradient(0, 0, 0, 300);
        sky.addColorStop(0, "#1a4a8a");
        sky.addColorStop(1, "#66a3ff");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, canvas.width, 350);

        // Nuvens
        ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
        clouds.forEach(c => {
            c.x += c.speed; if(c.x > 1100) c.x = -100;
            ctx.beginPath();
            ctx.arc(c.x, c.y, c.size * 0.5, 0, Math.PI*2);
            ctx.arc(c.x + c.size*0.4, c.y - c.size*0.2, c.size * 0.4, 0, Math.PI*2);
            ctx.arc(c.x + c.size*0.8, c.y, c.size * 0.4, 0, Math.PI*2);
            ctx.fill();
        });

        // Solo e Arena
        ctx.fillStyle = "#2d4c2a";
        ctx.fillRect(0, 300, canvas.width, 400);

        // Árvores (Fundo)
        trees.forEach(t => {
            ctx.fillStyle = "#3d2611";
            ctx.fillRect(t.x, t.y, 25 * t.scale, 50 * t.scale);
            ctx.fillStyle = "#1e3d1a";
            ctx.beginPath();
            ctx.moveTo(t.x - 30 * t.scale, t.y);
            ctx.lineTo(t.x + 12 * t.scale, t.y - 100 * t.scale);
            ctx.lineTo(t.x + 55 * t.scale, t.y);
            ctx.fill();
        });

        // Arena Centralizada (Clareira)
        let arenaGrd = ctx.createRadialGradient(500, 500, 100, 500, 500, 450);
        arenaGrd.addColorStop(0, "#4a7a45");
        arenaGrd.addColorStop(1, "#2d4c2a");
        ctx.fillStyle = arenaGrd;
        ctx.beginPath();
        ctx.ellipse(500, 520, 460, 240, 0, 0, Math.PI*2);
        ctx.fill();
    }

    // --- MODELOS ---
    function drawPlayer(x, y, frame) {
        ctx.save();
        const bounce = Math.sin(frame * 0.1) * 3;
        if (tempoEfeitoDano > 0) ctx.globalAlpha = 0.5;

        // Sombra
        ctx.fillStyle = "rgba(0,0,0,0.2)";
        ctx.beginPath(); ctx.ellipse(x+20, y+58, 22, 7, 0, 0, 7); ctx.fill();

        // Corpo
        ctx.fillStyle = (tempoEfeitoDano > 0) ? "#4a9eff" : "#ff4444"; // Muda cor se invencível
        ctx.beginPath();
        ctx.roundRect(x, y + 15 + bounce, 40, 38, 10); ctx.fill();

        // Cabeça
        ctx.fillStyle = "#ffdbac";
        ctx.beginPath();
        ctx.roundRect(x + 4, y - 10 + bounce, 32, 32, 12); ctx.fill();

        // Detalhes da Face
        ctx.fillStyle = "#000";
        ctx.fillRect(x + 10, y + 2 + bounce, 5, 5); // Olho esquerdo
        ctx.fillRect(x + 25, y + 2 + bounce, 5, 5); // Olho direito
        
        ctx.restore();
    }

    function drawPigeon(p) {
        const wing = Math.sin(p.frame * 0.5) * 18;
        
        // Sombra
        ctx.fillStyle = "rgba(0,0,0,0.15)";
        ctx.beginPath(); ctx.ellipse(p.x, p.y + 25, p.radius, 6, 0, 0, 7); ctx.fill();

        // Asas
        ctx.fillStyle = "#888";
        ctx.beginPath(); ctx.ellipse(p.x - 15, p.y, 25, Math.abs(wing), 0.5, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.ellipse(p.x + 15, p.y, 25, Math.abs(wing), -0.5, 0, 7); ctx.fill();

        // Corpo
        ctx.fillStyle = p.boss ? "#333" : "#aaa";
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fill();

        // Pescoço (Iridescente)
        ctx.fillStyle = "#4a9e86";
        ctx.beginPath(); ctx.arc(p.x + p.radius*0.4, p.y - p.radius*0.3, 10, 0, 7); ctx.fill();

        // Cabeça
        ctx.fillStyle = p.boss ? "#111" : "#888";
        ctx.beginPath(); ctx.arc(p.x + p.radius*0.7, p.y - p.radius*0.6, 14, 0, 7); ctx.fill();

        // Olho Mau
        ctx.fillStyle = "red";
        ctx.beginPath(); ctx.arc(p.x + p.radius*0.9, p.y - p.radius*0.7, 3, 0, 7); ctx.fill();

        // Bico
        ctx.fillStyle = "#ffaa00";
        ctx.beginPath();
        ctx.moveTo(p.x + p.radius + 6, p.y - p.radius*0.6);
        ctx.lineTo(p.x + p.radius + 18, p.y - p.radius*0.5);
        ctx.lineTo(p.x + p.radius + 6, p.y - p.radius*0.4);
        ctx.fill();
    }

    // --- LOGICA CORE ---
    let gameActive = false, player, pombos = [], bullets = [], tempoEfeitoDano = 0;
    let keys = {}, armaAtual = 'padrao', lastShot = 0, faseAtual = 1, globalFrame = 0;

    const armas = {
        leve: { dano: 12, vel: 22, cadencia: 110, cor: "#00ffff" },
        padrao: { dano: 35, vel: 16, cadencia: 320, cor: "#ffff00" },
        pesada: { dano: 100, vel: 9, cadencia: 1100, cor: "#ff4400" }
    };

    function setWeapon(t) {
        armaAtual = t;
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + t).classList.add('active');
    }

    function update() {
        if(!gameActive) return;
        globalFrame++;

        let vel = (tempoEfeitoDano > 0) ? 2.8 : 5.5;
        if(tempoEfeitoDano > 0) tempoEfeitoDano--;

        if(keys['KeyW']) player.y -= vel; if(keys['KeyS']) player.y += vel;
        if(keys['KeyA']) player.x -= vel; if(keys['KeyD']) player.x += vel;

        // Colisão com bordas da ARENA CENTRALIZADA
        player.x = Math.max(100, Math.min(860, player.x));
        player.y = Math.max(340, Math.min(620, player.y));

        pombos.forEach(p => {
            let d = Math.hypot(player.x - p.x, player.y - p.y);
            p.x += (player.x - p.x)/d * (2 + faseAtual * 0.3); 
            p.y += (player.y - p.y)/d * (2 + faseAtual * 0.3); 
            p.frame++;
            
            if(d < 45 && tempoEfeitoDano <= 0) {
                player.hp--; tempoEfeitoDano = 120; updateUI();
            }
        });

        bullets.forEach((b, i) => {
            b.x += b.vx; b.y += b.vy;
            pombos.forEach((p, pi) => {
                if(Math.hypot(b.x-p.x, b.y-p.y) < p.radius) {
                    p.hp -= b.dano; bullets.splice(i, 1);
                    if(p.hp <= 0) pombos.splice(pi, 1);
                    updateUI();
                }
            });
            if(b.x < 0 || b.x > 1000 || b.y < 0 || b.y > 700) bullets.splice(i, 1);
        });

        ctx.clearRect(0,0,1000,700);
        drawBackground();
        pombos.forEach(drawPigeon);
        drawPlayer(player.x, player.y, globalFrame);
        bullets.forEach(b => { 
            ctx.fillStyle = b.cor; ctx.beginPath(); ctx.arc(b.x, b.y, 7, 0, 7); ctx.fill(); 
            ctx.shadowBlur = 10; ctx.shadowColor = b.cor; // Brilho no tiro
        });
        ctx.shadowBlur = 0;

        if(pombos.length === 0) endLevel(true);
        requestAnimationFrame(update);
    }

    function updateUI() {
        document.getElementById("status").innerText = "VIDAS: " + "❤️".repeat(Math.max(0, player.hp));
        const list = document.getElementById("pombo-bars"); list.innerHTML = "";
        pombos.forEach(p => {
            list.innerHTML += `<div class="bar-bg"><div class="pombo-hp" style="width:${(p.hp/p.maxHp)*100}%"></div></div>`;
        });
        if(player.hp <= 0) endLevel(false);
    }

    function initFase() {
        player = { x: 500, y: 500, hp: 3 };
        const qtd = 2 + faseAtual;
        pombos = Array.from({length: qtd}, () => ({
            x: Math.random() > 0.5 ? -50 : 1050, 
            y: Math.random() * 700, 
            radius: 30, hp: 100 + (faseAtual*20), maxHp: 100 + (faseAtual*20), 
            frame: Math.random()*100, boss: Math.random() > 0.85
        }));
        document.getElementById("level-display").innerText = `FLORESTA CENTRAL - FASE ${faseAtual}`;
    }

    function startGame() { overlay.style.display="none"; gameActive=true; initFase(); update(); }
    
    function endLevel(win) { 
        gameActive = false; overlay.style.display="flex"; 
        document.getElementById("main-title").innerText = win ? "VITÓRIA!" : "DERROTA!";
        if(win) faseAtual++; else faseAtual = 1;
    }

    window.onkeydown = e => keys[e.code] = true;
    window.onkeyup = e => keys[e.code] = false;
    canvas.onmousedown = e => {
        if(!gameActive) return;
        const a = armas[armaAtual];
        if(Date.now() - lastShot < a.cadencia) return;
        const r = canvas.getBoundingClientRect();
        const ang = Math.atan2((e.clientY-r.top)-(player.y+15), (e.clientX-r.left)-(player.x+20));
        bullets.push({x:player.x+20, y:player.y+15, vx:Math.cos(ang)*a.vel, vy:Math.sin(ang)*a.vel, dano:a.dano, cor:a.cor});
        lastShot = Date.now();
    };
</script>
</body>
</html>
